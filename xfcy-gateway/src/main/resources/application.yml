spring:
  config:
    import:
      - nacos:common.yml
      - nacos:gateway.yml
  application:
    name: gateway
  profiles:
    active: dev
  cloud:
    # 使用 Nacos 作为服务注册发现
    nacos:
      discovery:
        server-addr: 192.168.20.88:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
      config:
        server-addr: 192.168.20.88:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
        file-extension: yml
        prefix: gateway
        shared-dataids: common.yml
        refreshable-dataids: common.yml
    gateway:
      # 生产路由以 Nacos dataId gateway.yml 为准；仓库内补录见 gateway-routes.yml。
      # 本地默认开启按服务名发现路由（/service-id/** 转发），阶段 7 前端统一前缀后切换为显式 routes。
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # CORS 收口：允许所有来源携带凭证（Boot 4 下用 allowedOriginPatterns）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
server:
  # K12：原 8085 与 cash_web 冲突，网关改用 8080
  port: 8080

# Sa-Token：与 provider 保持一致，token 走 Authorization 头，会话经 Redis 共享
sa-token:
  token-name: Authorization
  timeout: 259200
  active-timeout: -1
  is-concurrent: true
  is-share: true
  is-read-header: true
  is-read-cookie: false

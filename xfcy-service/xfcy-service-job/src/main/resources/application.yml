spring:
  config:
    import:
      - nacos:common.yml
  application:
    name: restkeeper-job
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.20.88:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
      config:
        server-addr: 192.168.20.88:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
        file-extension: yml
        shared-dataids: common.yml
        refreshable-dataids: common.yml
  datasource:
    store:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://192.168.20.88:3306/restkeeper_store?serverTimezone=Asia/Shanghai
      username: ${MYSQL_USERNAME:xf}
      password: ${MYSQL_PASSWORD:123456}
    order:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://192.168.20.88:3306/restkeeper_order?serverTimezone=Asia/Shanghai
      username: ${MYSQL_USERNAME:xf}
      password: ${MYSQL_PASSWORD:123456}
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
server:
  port: 8001
xxl:
  job:
    #调度中心校验 access_token：与 xxl_job_group.access_token 一致（该 admin 用 default_token）
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
    admin:
      #调度中心部署在根路径（/api/registry 可用，带 /xxl-job-admin 前缀会 404）
      addresses: http://192.168.20.88:8086
    executor:
      appname: restkeeper-job  #执行器的名称
      port: ${XXL_JOB_EXECUTOR_PORT:9999}     #本地程序和xxl-job的通信端口（多项目共用本机时可覆盖，避免端口冲突）
      #本地联调留空自动获取本机 IP；VM 部署可通过 XXL_JOB_EXECUTOR_IP 指定固定 IP
      ip: ${XXL_JOB_EXECUTOR_IP:}
      logretentiondays: 30 #日志保存时长(30天)

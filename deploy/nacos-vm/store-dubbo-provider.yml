# [VM 192.168.20.88] 与 deploy/nacos 同内容；地址/凭据以《部署手册-中间件与数据》§3 为准。
# dataId: store-dubbo-provider.yml（store provider）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.20.88:3306/restkeeper_store?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    username: ${MYSQL_USERNAME:xf}
    password: ${MYSQL_PASSWORD:123456}
seata:
  enabled: true
  application-id: store-dubbo-provider
  tx-service-group: store-dubbo-provider-seata-tx-service-group
  service:
    vgroup-mapping:
      store-dubbo-provider-seata-tx-service-group: default
    grouplist:
      default: 192.168.20.88:8091

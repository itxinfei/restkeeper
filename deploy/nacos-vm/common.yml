# [VM 192.168.20.88] 与 deploy/nacos 同内容；地址/凭据以《部署手册-中间件与数据》§3 为准。
# Nacos 共享配置 dataId: common.yml（group: DEFAULT_GROUP）— VM 版
# 所有服务经 sharedDataids 引入。地址/凭据以《部署手册-中间件与数据》§3 为准。
spring:
  redis:
    host: 192.168.20.88
    port: 6379
    password: ${REDIS_PASSWORD:123456}
  rabbitmq:
    host: 192.168.20.88
    port: 5672
    username: ${RABBITMQ_USERNAME:xf}
    password: ${RABBITMQ_PASSWORD:123456}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
# 短信通道（dev 打桩：未配置真实模板时发送会失败，不阻塞主流程）
sms:
  operator:
    signName: 心飞餐饮
    templateCode: SMS_000000000

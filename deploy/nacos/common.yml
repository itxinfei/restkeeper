# Nacos 共享配置 dataId: common.yml（group: DEFAULT_GROUP）
# 所有服务经 sharedDataids 引入。连接地址为本地 docker 的宿主机地址。
spring:
  redis:
    host: 127.0.0.1
    port: 6379
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
# 短信通道（dev 打桩：未配置真实模板时发送会失败，不阻塞主流程）
sms:
  operator:
    signName: 心飞餐饮
    templateCode: SMS_000000000

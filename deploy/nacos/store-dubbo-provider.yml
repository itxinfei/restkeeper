# dataId: store-dubbo-provider.yml（store provider）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/restkeeper_store?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
seata:
  enabled: true
  application-id: store-dubbo-provider
  tx-service-group: store-dubbo-provider-seata-tx-service-group
  service:
    vgroup-mapping:
      store-dubbo-provider-seata-tx-service-group: default
    grouplist:
      default: 127.0.0.1:8091

# xfcy 本地开发中间件（阶段 5 冒烟用）
# 用法：docker compose -f deploy/docker-compose.yml up -d
# 版本口径：以 D:\MyCode\部署手册-中间件与数据.md §2 为唯一权威（本文件只引用，不另立版本）。
#   JDK 25 / Spring Boot 4.1.3 / MySQL 8.4.13 / Redis 8.10.3 / ES 9.5.7 / Kibana 9.5.7 /
#   Nacos 3.3.0 / RabbitMQ 4.4.0 / MinIO RELEASE.2026-06-06T02-44-06Z
# 账号口径：root/admin/minioadmin 或 itxinfei，密码 123456（MinIO 根密码 ≥8 位用 itxinfei123）。
# 说明：端口映射到宿主机；应用/服务连接中间件的地址以《部署手册-中间件与数据》§3 的 192.168.20.88 为准（容器内 healthcheck 用 127.0.0.1 属容器内探测，不受此限）。
name: xfcy

services:
  nacos:
    image: nacos/nacos-server:v3.3.0
    container_name: xfcy-nacos
    environment:
      MODE: standalone
      # 手册 §5-3：首波上线先关客户端鉴权；凭据（admin/123456）补齐后再开
      NACOS_AUTH_ENABLE: "false"
      # 3.x 镜像启动强校验：token 需 Base64(≥32B)，identity key/value 必须成对
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-XAtoLkNhY29zRGljbGludGFrZW5Gb3JYZW5jeXByb3Zpc2lvbkEzMjE=}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-nacos-server}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nacos}
      JVM_XMS: 512m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"   # Open API
      - "9848:9848"   # gRPC
      - "8080:8080"   # 控制台（3.x 新增，手册 §3）
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      # 3.x 旧 readiness 端点可能 410，回退到控制台首页探测
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/v1/console/health/readiness || curl -sf http://127.0.0.1:8848/nacos/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4.13
    container_name: xfcy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅首次初始化执行：建 4 库 + 业务账号 xf/123456（见 sql/init.sql）
      - ./sql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

  redis:
    image: redis:8.10.3
    container_name: xfcy-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4.4.1-management
    container_name: xfcy-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-xf}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.7
    container_name: xfcy-es
    environment:
      discovery.type: single-node
      # 开发环境关闭安全层；上生产再启用 TLS + 账号
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.7
    container_name: xfcy-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TZ: Asia/Shanghai
    ports:
      - "5601:5601"

  minio:
    image: minio/minio:RELEASE.2026-06-06T02-44-06Z
    container_name: xfcy-minio
    command: server /data --console-address ":9001"
    environment:
      # 手册 §5-2：根密码必须 ≥8 位，否则启动即 FATAL
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-itxinfei123}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  nacos-data:
  mysql-data:
  redis-data:
  rabbitmq-data:
  es-data:
  minio-data:

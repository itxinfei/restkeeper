<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C 端 · 门店菜单</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  body{display:flex;align-items:flex-start;justify-content:center;background:#e9edf1}
  .mhead{display:flex;align-items:flex-start;gap:10px}
  .mhead h1{font-size:19px;font-weight:600}
  .mhead .sub{font-size:12px;color:var(--c-text-2);margin-top:2px}
  .mhead .rt{margin-left:auto;text-align:right;font-size:12px;color:var(--c-text-2)}
  .search{margin-top:12px;height:38px;border-radius:var(--r-pill);background:var(--c-neutral-soft);display:flex;align-items:center;padding:0 14px;font-size:13px;color:var(--c-text-3);gap:8px}
  .cats{display:flex;gap:8px;padding:12px 16px 4px;overflow:hidden}
  .cats a{flex:none;padding:7px 14px;border-radius:var(--r-pill);background:var(--c-neutral-soft);font-size:13px;color:var(--c-text-2)}
  .cats a.on{background:var(--c-brand);color:#fff;font-weight:500}
  .sec{font-size:12px;color:var(--c-text-3);letter-spacing:1px;margin:14px 2px 8px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:#fff;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm)}
  .pic{height:104px;display:grid;place-items:center;font-size:36px;position:relative}
  .p1{background:linear-gradient(135deg,#fde9d7,#f6c89f)}.p2{background:linear-gradient(135deg,#e6ecda,#bccfa4)}
  .p3{background:linear-gradient(135deg,#f6dfd2,#e6a685)}.p4{background:linear-gradient(135deg,#efe6d8,#d3b48c)}
  .pic i{position:absolute;right:6px;bottom:5px;font-size:11px;font-style:normal;color:#fff;background:rgba(17,24,39,.65);padding:1px 6px;border-radius:8px}
  .info{padding:10px 12px 12px}
  .info h2{font-size:14px;font-weight:500}
  .info p{font-size:11px;color:var(--c-text-2);margin-top:2px;min-height:15px}
  .buy{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .price{font-size:16px;font-weight:700;color:var(--c-brand)}
  .add{width:26px;height:26px;border-radius:50%;background:var(--c-brand);color:#fff;display:grid;place-items:center;font-size:16px}
  .mbar{background:var(--c-text)}
</style>
</head>
<body>
<div class="phone">
  <div class="mhead">
    <div><h1>心飞餐饮 · 国贸店</h1><div class="sub">堂食点餐 · 桌台 A03</div></div>
    <div class="rt">配送<br>自取</div>
  </div>
  <div style="padding:0 18px"><div class="search" style="color:var(--c-text-2)">🔍 搜索菜品，如「红烧肉」</div></div>
  <nav class="cats"><a class="on">招牌推荐</a><a>热菜</a><a>凉菜</a><a>主食</a><a>饮品</a><a>套餐</a></nav>
  <div class="mscroll">
    <div class="sec">招牌推荐 · 8 道</div>
    <div class="cards">
      <div class="card"><div class="pic p1">🍖<i>示意</i></div><div class="info"><h2>招牌红烧肉</h2><p>五花肉 · 冰糖慢炖</p><div class="buy"><span class="price">¥48<small style="font-size:11px;font-weight:400;color:var(--c-text-3)">/例</small></span><span class="add">+</span></div></div></div>
      <div class="card"><div class="pic p2">🐟<i>示意</i></div><div class="info"><h2>清蒸鲈鱼</h2><p>鲜活 · 粤式蒸法</p><div class="buy"><span class="price">¥88<small style="font-size:11px;font-weight:400;color:var(--c-text-3)">/条</small></span><span class="add">+</span></div></div></div>
      <div class="card"><div class="pic p3">🥬<i>示意</i></div><div class="info"><h2>蒜蓉时蔬</h2><p>时令 · 清炒</p><div class="buy"><span class="price">¥22<small style="font-size:11px;font-weight:400;color:var(--c-text-3)">/例</small></span><span class="add">+</span></div></div></div>
      <div class="card"><div class="pic p4">🍚<i>示意</i></div><div class="info"><h2>腊味煲仔饭</h2><p>丝苗米 · 锅巴香</p><div class="buy"><span class="price">¥36<small style="font-size:11px;font-weight:400;color:var(--c-text-3)">/份</small></span><span class="add">+</span></div></div></div>
    </div>
  </div>
  <div class="mbar">
    <div style="width:34px;height:34px;border-radius:50%;background:var(--c-brand);display:grid;place-items:center;position:relative">🛒<b style="position:absolute;top:-4px;right:-4px;background:#fff;color:var(--c-text);font-size:11px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center">3</b></div>
    <div style="font-size:12px;color:#c9c2b8">已选 3 道<b style="display:block;font-size:16px;color:#fff">¥152.00</b></div>
    <div class="sp" style="margin-left:auto;background:var(--c-brand);border-radius:12px;padding:10px 18px;font-size:14px;font-weight:500">去结算</div>
  </div>
</div>
</body>
</html>
